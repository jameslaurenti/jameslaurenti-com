<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Experiment: a small turn-based dungeon game. Unlisted. -->
<title>Candle Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one column for one thumb. Numbers on top, a candlelit 4x4 floor in the middle, your pocket under it.
   Deliberately dark-only: it is played in a dark room next to a sleeping kid. */
:root {
  --soot: #100d0b;
  --stone: #1a1511;
  --card: #221b16;
  --edge: #3a3029;
  --bone: #d9c9ab;
  --ash: #8f7f69;
  --flame: #eda14b;
  --ember: #d6654d;
  --steel: #a3b4bb;
  --gold: #d8b25a;
  --wax: #e6d8ba;
  --rust: #c07a45;
  --moss: #98ad78;
  --hex: #b884c0;
  --font-display: "IM Fell English SC", "IM Fell English", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@property --gx { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
@property --gy { syntax: "<percentage>"; inherits: false; initial-value: 50%; }

html { box-sizing: border-box; height: 100%; background: var(--soot); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow-x: hidden;
  background: var(--soot); color: var(--bone);
  font: 1rem/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }

.app {
  min-height: 100%; max-width: 480px; margin: 0 auto;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}

/* ---- numbers ---- */
.hud { display: grid; gap: 8px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { margin: 0; font: 400 1.45rem/1 var(--font-display); color: var(--flame); }
.where { margin: 0; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.stat { background: var(--stone); border-radius: 10px; padding: 7px 10px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.stat-label { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.stat-value { font: 800 1.3rem/1 var(--font-body); font-variant-numeric: lining-nums tabular-nums; }
.stat-value small { font-size: .78rem; font-weight: 500; color: var(--ash); }
#hp { color: var(--flame); }
#blade { color: var(--steel); }
#coins { color: var(--gold); }
.meter { display: block; height: 3px; border-radius: 2px; background: rgb(255 235 205 / .07); overflow: hidden; }
.meter > i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--flame); transition: width .3s ease; }
.omen { display: grid; gap: 5px; font-size: .84rem; color: var(--ash); }
.omen.here { color: var(--ember); }
.omen.here .meter > i { background: var(--ember); }
.omen.dark { color: var(--hex); }
.omen.dark .meter > i { background: var(--hex); }
.next { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .82rem; color: var(--ash); }
.next span { display: inline-flex; align-items: center; gap: 4px; color: var(--tint); }
.next .ico { width: 15px; height: 15px; }

/* ---- the floor ---- */
.board {
  --gap: 6px;
  position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap);
  width: min(100%, 460px);
  width: min(100%, 460px, max(280px, calc((100svh - 330px) * .86)));
  margin: 0 auto;
  touch-action: none; user-select: none; -webkit-user-select: none;
  border-radius: 14px;
  background: radial-gradient(circle at var(--gx) var(--gy), rgb(237 161 75 / .15), transparent 58%);
  transition: --gx .25s ease, --gy .25s ease;
}
.slot { aspect-ratio: 6 / 7; border-radius: 10px; border: 1px dashed rgb(255 235 205 / .06); }

.card, .floater {
  position: absolute; top: 0; left: 0;
  width: calc((100% - 3 * var(--gap)) / 4);
  height: calc((100% - 3 * var(--gap)) / 4);
  translate: calc(var(--c, 0) * (100% + var(--gap))) calc(var(--r, 0) * (100% + var(--gap)));
}
.card {
  --tint: var(--bone);
  container-type: inline-size;
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto;
  grid-template-areas: "val tag" "art art" "name name";
  align-items: center; padding: 5px 5px 6px; margin: 0;
  border: 1px solid var(--edge); border-radius: 10px;
  background: linear-gradient(180deg, var(--card) 40%, color-mix(in srgb, var(--card) 84%, var(--tint)));
  color: var(--tint); text-align: center;
  transition: translate .22s cubic-bezier(.3, .7, .3, 1), filter .25s ease, border-color .25s ease;
}
.card.l2 { filter: brightness(.7) saturate(.85); }
.card.l3 { filter: brightness(.54) saturate(.72); }
.card.l4 { filter: brightness(.42) saturate(.6); }
.card.reach { cursor: pointer; border-color: color-mix(in srgb, var(--tint) 34%, var(--edge)); box-shadow: 0 6px 16px rgb(0 0 0 / .35); }
.card.reach:hover { border-color: color-mix(in srgb, var(--tint) 60%, var(--edge)); }
/* Dread monsters wear a gold frame and wardens a red card; both carry a tag on the top edge. */
.card.elite { z-index: 1; border: 2px solid color-mix(in srgb, var(--gold) 75%, var(--edge)); background: radial-gradient(circle at 50% 48%, rgb(216 178 90 / .22), transparent 72%), var(--card); }
.card.t-boss { z-index: 1; border: 2px solid var(--ember); background: radial-gradient(circle at 50% 45%, rgb(214 101 77 / .42), rgb(96 26 18 / .6) 72%), var(--card); }
.card.t-boss .c-name { color: #f6d9cb; }
.c-rank {
  position: absolute; top: -7px; left: 50%; translate: -50% 0;
  padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  font: 800 clamp(.5rem, 9.5cqw, .62rem)/1.3 var(--font-body); letter-spacing: .1em; text-transform: uppercase;
}
.elite .c-rank { background: var(--gold); color: var(--soot); }
.t-boss .c-rank { background: var(--ember); color: #1c0d09; }
.card.aim { border-color: var(--flame); box-shadow: 0 0 0 1px var(--flame), 0 6px 16px rgb(0 0 0 / .35); }
.card.lethal { border-color: var(--ember); }
.c-val { grid-area: val; justify-self: start; font: 800 clamp(1rem, 25cqw, 1.45rem)/1 var(--font-body); font-variant-numeric: lining-nums tabular-nums; }
.c-tag { grid-area: tag; justify-self: end; font: 700 clamp(.58rem, 11cqw, .72rem)/1 var(--font-body); font-variant-numeric: lining-nums; padding: 2px 4px; border-radius: 5px; }
.c-tag:empty { display: none; }
.c-tag.hurt { background: rgb(214 101 77 / .2); color: #ef9d89; }
.c-tag.lethal { background: var(--ember); color: var(--soot); }
.c-tag.safe { background: rgb(163 180 187 / .15); color: var(--steel); }
.c-tag.aimed { background: rgb(237 161 75 / .18); color: var(--flame); }
.c-art { grid-area: art; justify-self: center; width: 48%; max-width: 50px; height: auto; aspect-ratio: 1; }
.c-name { grid-area: name; font: 400 clamp(.56rem, 11.5cqw, .78rem)/1.05 var(--font-display); color: var(--bone); text-wrap: balance; overflow-wrap: anywhere; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.t-monster { --tint: var(--ember); }
.t-boss { --tint: #f0876c; }
.t-dread { --tint: var(--gold); }
.t-wax { --tint: var(--wax); }
.t-blade { --tint: var(--steel); }
.t-coin, .t-chest { --tint: var(--gold); }
.t-trap { --tint: var(--rust); }
.t-shrine { --tint: var(--moss); }
.t-altar { --tint: var(--hex); }
.t-stair { --tint: var(--flame); border-color: rgb(237 161 75 / .5); }
.t-hero { --tint: var(--flame); }
.t-tool { --tint: var(--flame); }

.card.enter { animation: land .3s cubic-bezier(.2, .8, .3, 1) backwards; }
.card.leave { animation: taken .24s ease forwards; pointer-events: none; z-index: 1; }
@keyframes land { from { opacity: 0; scale: .72; } }
@keyframes taken { to { opacity: 0; scale: .8; } }

/* you */
.hero {
  z-index: 2;
  border-color: rgb(237 161 75 / .4);
  background: radial-gradient(circle at 50% 38%, rgb(237 161 75 / .2), transparent 68%), var(--card);
}
.hero .c-tag { display: inline-flex; align-items: center; gap: 2px; color: var(--steel); background: rgb(163 180 187 / .12); }
.hero .c-tag .ico { width: 1em; height: 1em; }
.candle { grid-area: art; justify-self: center; align-self: stretch; width: 22%; max-width: 20px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 2px; }
.flame {
  width: 74%; aspect-ratio: 1 / 1.75; margin-bottom: 2px;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(ellipse at 50% 72%, #fff3d6 0 18%, #ffc56a 34%, #e8792f 70%, rgb(232 121 47 / 0) 72%);
  box-shadow: 0 0 16px 5px rgb(237 161 75 / .28);
  transform-origin: 50% 90%;
  animation: flicker 2.6s ease-in-out infinite;
  transition: opacity .5s ease;
}
.stick {
  width: 100%; height: calc(10% + 62% * var(--life, 1));
  border-radius: 3px 3px 2px 2px;
  background: linear-gradient(90deg, #bba98a, #ece0c6 45%, #a8977a);
  transition: height .35s ease;
}
.hero.out .flame { opacity: 0; }
.hero.out { border-color: var(--edge); background: var(--card); }
.hero.hurt { animation: hurt .34s ease; }
@keyframes flicker {
  0%, 100% { transform: scale(1, 1) rotate(0deg); }
  30% { transform: scale(.94, 1.05) rotate(-2deg); }
  55% { transform: scale(1.04, .96) rotate(1.5deg); }
  80% { transform: scale(.97, 1.03) rotate(-1deg); }
}
@keyframes hurt {
  0%, 100% { transform: translateX(0); border-color: rgb(237 161 75 / .4); }
  20% { transform: translateX(-5px); border-color: var(--ember); }
  45% { transform: translateX(4px); }
  70% { transform: translateX(-2px); }
}

.floater {
  z-index: 3; display: grid; place-items: center; pointer-events: none;
  font: 800 1.45rem/1 var(--font-body); font-variant-numeric: lining-nums;
  text-shadow: 0 2px 10px rgb(0 0 0 / .85);
  animation: rise .95s ease-out forwards;
}
.floater.dmg, .floater.mark { color: #f08f78; }
.floater.heal { color: var(--wax); padding-bottom: 46%; }
.floater.gold { color: var(--gold); font-size: 1.05rem; padding-top: 52%; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  15% { opacity: 1; }
  to { opacity: 0; transform: translateY(-28px); }
}

/* ---- pocket ---- */
.pocket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.tool {
  display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 50px; padding: 5px 3px;
  border-radius: 10px; border: 1px solid var(--edge); background: var(--stone);
  font-size: .72rem; line-height: 1.05; color: var(--bone); cursor: pointer; overflow-wrap: anywhere;
}
.tool .ico { width: 20px; height: 20px; color: var(--flame); }
.tool.armed { border-color: var(--flame); background: rgb(237 161 75 / .14); }
.tool.swap .ico { color: var(--steel); }
.tool.empty { border-style: dashed; background: transparent; color: var(--ash); cursor: default; }

/* ---- under the floor ---- */
.log { margin: 0; min-height: 2.7em; font-size: .93rem; text-align: center; text-wrap: balance; color: var(--bone); }
.log.hint { color: var(--flame); }
.relics { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.relics:empty { display: none; }
.chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--edge); background: var(--stone); font-size: .76rem; line-height: 1; color: var(--bone); cursor: pointer; }
.chip.spent { color: var(--ash); text-decoration: line-through; }
.bar { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.best { font-size: .8rem; color: var(--ash); font-variant-numeric: lining-nums tabular-nums; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.ghost { padding: 8px 11px; border-radius: 8px; border: 1px solid var(--edge); background: transparent; font-size: .84rem; color: var(--ash); cursor: pointer; }
.ghost[aria-pressed="true"] { color: var(--flame); border-color: rgb(237 161 75 / .45); }

/* ---- sheets ---- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: flex; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgb(10 8 6 / .78);
}
.sheet {
  margin: auto; width: min(100%, 420px);
  display: grid; gap: 14px; padding: 20px;
  background: var(--stone); border: 1px solid var(--edge); border-radius: 16px;
  box-shadow: 0 24px 60px rgb(0 0 0 / .6);
  animation: land .28s cubic-bezier(.2, .8, .3, 1);
}
.sheet h2 { margin: 0; font: 400 1.7rem/1.1 var(--font-display); color: var(--flame); text-wrap: balance; }
.sheet h3 { margin: 0; font-size: .68rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.sheet p { margin: 0; color: var(--bone); }
.sheet .muted { color: var(--ash); font-size: .9rem; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: .9rem; }
.legend li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.legend .ico { width: 22px; height: 22px; color: var(--tint); margin-top: 1px; }
.legend b { color: var(--tint); font-weight: 700; }
.choices { display: grid; gap: 8px; }
.choice { display: grid; gap: 4px; padding: 12px 14px; text-align: left; border-radius: 12px; border: 1px solid var(--edge); background: var(--card); cursor: pointer; }
.choice:hover { border-color: rgb(184 132 192 / .6); }
.choice .give { color: #ef9d89; font-size: .92rem; }
.choice .get { color: var(--moss); font-size: .92rem; }
.choice b { font-weight: 700; }
.choice.relic b { font: 400 1.15rem/1.1 var(--font-display); color: var(--flame); }
.choice.relic span { font-size: .92rem; color: var(--bone); }
.switches { display: grid; gap: 8px; }
.switch {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px;
  text-align: left; border-radius: 12px; border: 1px solid var(--edge); background: var(--card); cursor: pointer;
}
.switch b { display: block; color: var(--bone); }
.switch span span { display: block; margin-top: 2px; font-size: .88rem; line-height: 1.3; color: var(--ash); }
.switch i { position: relative; width: 42px; height: 24px; border-radius: 12px; background: var(--edge); transition: background .2s ease; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ash); transition: translate .2s ease, background .2s ease; }
.switch[aria-checked="true"] i { background: rgb(237 161 75 / .45); }
.switch[aria-checked="true"] i::after { translate: 18px 0; background: var(--flame); }
.purse { display: inline-flex; align-items: center; gap: 5px; color: var(--gold); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
.purse .ico { width: 18px; height: 18px; }
.shop-sec { display: grid; gap: 6px; }
.ware { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px 9px 12px; border-radius: 10px; background: var(--card); }
.ware.sold { opacity: .45; }
.w-name { display: block; font: 400 1.02rem/1.15 var(--font-display); color: var(--bone); }
.w-text { display: block; font-size: .84rem; line-height: 1.3; color: var(--ash); }
.buy {
  min-width: 66px; display: inline-flex; justify-content: center; align-items: center; gap: 4px; padding: 8px 10px;
  border-radius: 8px; border: 1px solid rgb(216 178 90 / .5); background: rgb(216 178 90 / .1);
  color: var(--gold); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; cursor: pointer;
}
.buy .ico { width: 15px; height: 15px; }
.buy:disabled { border-color: var(--edge); background: transparent; color: var(--ash); cursor: default; }
.tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tally div { display: grid; gap: 3px; padding: 9px 4px; text-align: center; border-radius: 10px; background: var(--card); }
.tally span { font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); }
.tally b { font: 800 1.3rem/1 var(--font-body); font-variant-numeric: lining-nums tabular-nums; color: var(--bone); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.primary { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--flame); color: #1c1207; font-weight: 700; font-size: 1rem; cursor: pointer; }

.dimmer { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .45); pointer-events: none; }

/* Settings: larger text swaps the old-style lettering on cards for plain type; stronger contrast brightens text and far cards. */
:root.big { font-size: 118.75%; }
:root.big .c-val { font-size: clamp(1.1rem, 31cqw, 1.9rem); }
:root.big .c-name { font: 700 clamp(.62rem, 13.5cqw, .95rem)/1.05 var(--font-body); }
:root.big .c-tag { font-size: clamp(.66rem, 13cqw, .85rem); }
:root.big .c-art { width: 44%; }
:root.big .ico { stroke-width: 1.9; }
:root.big .w-name, :root.big .choice.relic b { font-family: var(--font-body); font-weight: 700; }
:root.contrast { --bone: #f3e8d2; --ash: #bcae96; --edge: #5c4c3e; }
:root.contrast .card.l2 { filter: brightness(.92); }
:root.contrast .card.l3 { filter: brightness(.84); }
:root.contrast .card.l4 { filter: brightness(.76); }
:root.contrast .card.reach:not(.elite):not(.t-boss) { border-color: color-mix(in srgb, var(--tint) 65%, var(--edge)); }
:root.contrast .c-tag.hurt { background: rgb(214 101 77 / .32); color: #ffb6a4; }

@media (prefers-reduced-motion: reduce) {
  .board, .card, .stick, .meter > i { transition: none; }
  .flame { animation: none; }
  .card.enter, .sheet, .hero.hurt { animation: none; }
  .card.leave { animation: taken .01s forwards; }
  .floater { animation: fade 1.2s linear forwards; }
  @keyframes fade { 0%, 70% { opacity: 1; } to { opacity: 0; } }
}
</style>
</head>

<script>
(() => {
"use strict";

/* ---------- rules: plain state and functions, no DOM ---------- */
const N = 4;
const FLOOR_STEPS = 18;
const START_CANDLE = 14;
let rand = Math.random;
const rint = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pickOne = (a) => a[Math.floor(rand() * a.length)];
function shuffled(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const row = (i) => Math.floor(i / N), col = (i) => i % N;
const cell = (r, c) => (r < 0 || r >= N || c < 0 || c >= N ? -1 : r * N + c);
const ORTH = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const isFoe = (c) => !!c && (c.t === "monster" || c.t === "boss");

const FLOORS = ["Cellar", "Crypt", "Ossuary", "Catacombs", "Undercroft", "Charnel House", "Sump", "Barrow", "Old Well", "Root of the Hill"];
const WARDENS = ["Rat King", "Sexton", "Bone Abbot", "Pale Bishop", "Undercroft Wyrm", "Charnel Hound", "Sump Witch", "Barrow Lord", "Thing in the Well", "Hunger Below"];
const BEASTS = ["", "Rat", "Bat", "Spider", "Skeleton", "Ghoul", "Wight", "Wraith", "Gargoyle", "Revenant", "Horror"];
const BEAST_ICON = { Rat: "rat", Bat: "bat", Spider: "spider", Skeleton: "skull", Ghoul: "ghoul", Wight: "hood", Wraith: "ghost", Gargoyle: "horns", Revenant: "helm", Horror: "eye" };
const floorName = (f) => FLOORS[f - 1] || "Deep";
const wardenName = (f) => WARDENS[f - 1] || "Nameless Warden";

const RELICS = {
  whetstone: { name: "Whetstone", text: "Blades you pick up are 1 stronger.", price: 18 },
  longwick: { name: "Long Wick", text: "Your candle grows 3 taller, lit.", price: 18 },
  tinderbox: { name: "Tinderbox", text: "Every kill relights 1 candle.", price: 28 },
  gloves: { name: "Thick Gloves", text: "Spikes hurt half as much.", price: 10 },
  magpie: { name: "Magpie's Eye", text: "Coin piles are worth double.", price: 22 },
  beeswax: { name: "Beeswax", text: "Wax relights 2 more.", price: 16 },
  lockpick: { name: "Lockpick", text: "Chests never bite, and hold half again as much.", price: 12 },
  notched: { name: "Notched Edge", text: "Once you hold a blade, it never wears below 1.", price: 24 },
  ratbane: { name: "Ratbane", text: "Rats and bats die without a fight.", price: 12 },
  spare: { name: "Spare Candle", text: "The first time your flame goes out, it relights at 5.", price: 26 },
  moth: { name: "Moth Lantern", text: "Always see the next card before it lands.", price: 14 },
  tithe: { name: "Tithe Box", text: "Every kill pays 2 more coins.", price: 16 },
  pockets: { name: "Deep Pockets", text: "Carry 4 tools instead of 3.", price: 12 },
  haggler: { name: "Haggler's Tongue", text: "Traders charge a quarter less.", price: 16 },
  mail: { name: "Mail Shirt", text: "Your blade takes spikes for you too.", price: 14 },
  lucky: { name: "Lucky Coin", text: "Altars offer three deals instead of two.", price: 10 },
};
const TOOLS = {
  smoke: { name: "Smoke", icon: "smoke", text: "Swap places with a card beside you without touching it.", price: 9 },
  holy: { name: "Holy Water", icon: "vial", text: "Halve a monster beside you.", price: 11 },
  rope: { name: "Rope", icon: "rope", text: "Your next step can be diagonal.", price: 7 },
  oil: { name: "Oil Flask", icon: "flask", text: "Burn every monster beside you for 3.", price: 11 },
  torch: { name: "Torch", icon: "torch", text: "See the next 3 cards for 10 steps.", price: 6 },
  stub: { name: "Candle Stub", icon: "stub", text: "Relight 4.", price: 8 },
};
const has = (s, k) => s.relics.includes(k);
const relicsLeft = (s) => Object.keys(RELICS).filter((k) => !has(s, k));
const pocketSize = (s) => (has(s, "pockets") ? 4 : 3);

function cardName(c) {
  switch (c.t) {
    case "monster": case "boss": return c.name;
    case "wax": return "Wax";
    case "blade": return "Blade";
    case "coin": return "Coins";
    case "trap": return "Spikes";
    case "chest": return "Chest";
    case "shrine": return "Shrine";
    case "altar": return "Altar";
    case "stair": return "Stair down";
  }
  return "";
}

function beast(v, elite) {
  return { t: "monster", v, name: (elite ? "Dread " : "") + BEASTS[Math.min(v, 10)], elite: !!elite };
}

function deal(s) {
  const f = s.floor, r = rand() * 100;
  let c;
  if (r < 39) c = rand() < 0.08 ? beast(5 + f + rint(0, 2), true) : beast(rint(1 + ((f - 1) >> 1), 3 + f + Math.max(0, f - 5)));
  else if (r < 53) c = { t: "coin", v: rint(1, 4 + f) };
  else if (r < 69) c = { t: "wax", v: rint(1, 4 + ((f - 1) >> 1)) };
  else if (r < 82) c = { t: "blade", v: rint(1, 2 + (f >> 1)) };
  else if (r < 88) c = { t: "trap", v: rint(1, 2 + (f >> 1)) };
  else if (r < 94) c = { t: "chest", v: rint(4 + f, 8 + 3 * f), mimic: rand() < 0.15, bite: 3 + f };
  else if (r < 97) c = { t: "shrine", v: 1 };
  else c = { t: "altar", v: 0 };
  c.id = s.uid++;
  return c;
}

function makeWarden(s) {
  return { t: "boss", v: 5 + 2 * s.floor + rint(0, 2), name: wardenName(s.floor), age: 0, id: s.uid++ };
}

function fillQueue(s) {
  while (s.queue.length < 3) s.queue.push(deal(s));
}

// A fresh room: new cards, a new warden waiting, you somewhere in the middle.
function enterFloor(s) {
  s.floorSteps = 0;
  s.wardenOut = false;
  s.stairOpen = false;
  s.stairDue = false;
  s.dark = 0;
  s.warden = makeWarden(s);
  s.queue = [];
  s.hero = [5, 6, 9, 10][rint(0, 3)];
  s.grid = [];
  for (let i = 0; i < N * N; i++) s.grid.push(i === s.hero ? null : deal(s));
  fillQueue(s);
}

function newRun() {
  const s = {
    hp: START_CANDLE, max: START_CANDLE, blade: 0, coins: 0, earned: 0, floor: 1, steps: 0, kills: 0,
    relics: [], tools: [], spareUsed: false, torch: 0, debt: false, phase: "play", shop: null, deal: null, spoils: null,
    uid: 1, cause: "", log: "",
  };
  enterFloor(s);
  // A kind start: one blade within reach.
  const near = ORTH.map(([dr, dc]) => cell(row(s.hero) + dr, col(s.hero) + dc));
  s.grid[pickOne(near)] = { t: "blade", v: 3, id: s.uid++ };
  s.log = "Your candle is lit. Step onto a card beside it.";
  return s;
}

function addRelic(s, k) {
  s.relics.push(k);
  if (k === "longwick") { s.max += 3; s.hp += 3; }
}
function gain(s, n) {
  s.coins += n;
  s.earned += n;
}

function fightOutcome(s, v) {
  if (v <= 2 && has(s, "ratbane")) return { dmg: 0, blade: s.blade };
  const absorb = Math.min(s.blade, v);
  let blade = s.blade - absorb;
  if (s.blade > 0 && has(s, "notched")) blade = Math.max(1, blade);
  return { dmg: v - absorb, blade };
}
// Spikes ignore your blade, unless you wear mail.
function trapOutcome(s, v) {
  const hit = has(s, "gloves") ? Math.floor(v / 2) : v;
  const absorb = has(s, "mail") ? Math.min(s.blade, hit) : 0;
  return { dmg: hit - absorb, blade: s.blade - absorb };
}

// Candle lost by stepping onto c, where it can be known in advance.
function costOf(s, c) {
  if (isFoe(c)) return fightOutcome(s, c.v).dmg;
  if (c.t === "trap") return trapOutcome(s, c.v).dmg;
  return 0;
}

function spoils(s) {
  const left = relicsLeft(s);
  if (left.length && rand() < 0.35) {
    const k = pickOne(left);
    addRelic(s, k);
    return `It drops ${RELICS[k].name}: ${RELICS[k].text}`;
  }
  if (s.tools.length < pocketSize(s)) {
    const k = pickOne(Object.keys(TOOLS));
    s.tools.push(k);
    return `It drops a ${TOOLS[k].name}.`;
  }
  gain(s, 15);
  return "It drops 15 coins.";
}

// A foe died, by your hand or a tool. v is what it was worth before any burning.
function reward(s, c, v, ev) {
  s.kills++;
  const boss = c.t === "boss";
  const pay = v + (has(s, "tithe") ? 2 : 0) + (boss ? 8 * s.floor : 0);
  gain(s, pay);
  let msg = ` +${pay} coins.`;
  if (s.hp > 0 && s.hp < s.max && has(s, "tinderbox")) { s.hp++; ev.heal++; }
  if (c.elite) msg += " " + spoils(s);
  if (boss) {
    s.stairOpen = true;
    s.stairDue = true;
    s.spoils = shuffled(relicsLeft(s)).slice(0, 2);
    msg += " The stair down opens beside you.";
  }
  return msg;
}

function fight(s, c, ev) {
  const o = fightOutcome(s, c.v), had = s.blade, name = c.name;
  s.blade = o.blade;
  s.hp -= o.dmg;
  ev.dmg += o.dmg;
  s.cause = (c.t === "boss" ? "the " : "a ") + name;
  let msg;
  if (c.t === "boss") msg = `The ${name} falls.` + (o.dmg ? ` Candle −${o.dmg}.` : "");
  else if (c.v <= 2 && has(s, "ratbane")) msg = `The ${name} dies in the ratbane.`;
  else if (!had) msg = `The ${name} burns you for ${o.dmg}.`;
  else if (o.dmg) msg = o.blade ? `Your blade dulls on the ${name}. Candle −${o.dmg}.` : `Your blade breaks on the ${name}. Candle −${o.dmg}.`;
  else msg = `Your blade cuts down the ${name}.` + (o.blade ? ` Blade ${had} → ${o.blade}.` : " It breaks.");
  return msg + reward(s, c, c.v, ev);
}

function resolve(s, c, ev) {
  switch (c.t) {
    case "monster": case "boss": return fight(s, c, ev);
    case "chest": {
      if (c.mimic && !has(s, "lockpick")) return "The chest has teeth! " + fight(s, { t: "monster", v: c.bite, name: "Mimic" }, ev);
      const g = has(s, "lockpick") ? Math.round(c.v * 1.5) : c.v;
      gain(s, g);
      return `The chest holds ${g} coins.`;
    }
    case "wax": {
      const g = Math.min(c.v + (has(s, "beeswax") ? 2 : 0), s.max - s.hp);
      s.hp += g;
      ev.heal += g;
      return g ? `Wax. Candle +${g}.` : "Wax, but your candle is already full.";
    }
    case "blade": {
      const v = c.v + (has(s, "whetstone") ? 1 : 0), old = s.blade;
      s.blade += v;
      return old ? `A blade. Blade ${old} → ${s.blade}.` : `You pick up a ${v} blade.`;
    }
    case "coin": {
      const g = c.v * (has(s, "magpie") ? 2 : 1);
      gain(s, g);
      return `${g} coins.`;
    }
    case "trap": {
      const o = trapOutcome(s, c.v), had = s.blade;
      s.hp -= o.dmg;
      s.blade = o.blade;
      ev.dmg += o.dmg;
      s.cause = "spikes";
      if (o.blade < had) return `Spikes. Your mail takes ${had - o.blade}.` + (o.dmg ? ` Candle −${o.dmg}.` : "");
      return o.dmg ? `Spikes. Candle −${o.dmg}.` : "Spikes, but your gloves take it.";
    }
    case "shrine":
      s.max += 1;
      s.hp += 1;
      ev.heal += 1;
      return "A shrine. Your candle grows one taller.";
    case "altar":
      return "An altar. Something here wants to trade.";
    case "stair":
      return "You take the stair down. A trader waits on the landing.";
  }
  return "";
}

function checkDeath(s, ev) {
  if (s.hp > 0) return "";
  if (has(s, "spare") && !s.spareUsed) {
    s.spareUsed = true;
    s.hp = Math.min(5, s.max);
    ev.spare = true;
    return " Your spare candle catches. Candle 5.";
  }
  s.hp = 0;
  s.phase = "dead";
  ev.dead = true;
  return "";
}

function draw(s) {
  if (s.stairDue) { s.stairDue = false; return { t: "stair", v: 0, id: s.uid++ }; }
  if (!s.wardenOut && s.floorSteps >= FLOOR_STEPS - 1) { s.wardenOut = true; return s.warden; }
  const c = s.queue.shift();
  fillQueue(s);
  return c;
}

// The next n cards to land, one per step, if nothing else changes.
function upcoming(s, n) {
  const out = [];
  let q = 0, fs = s.floorSteps, out_ = s.wardenOut;
  for (let k = 0; k < n; k++, fs++) {
    if (!out_ && fs >= FLOOR_STEPS - 1) { out.push(s.warden); out_ = true; }
    else out.push(s.queue[q++]);
  }
  return out.filter(Boolean);
}

// Once per step: torches burn down, wardens grow, and after the warden falls, the dark grows.
function tick(s) {
  let log = "";
  if (s.torch > 0) s.torch--;
  for (const k of s.grid) {
    if (k && k.t === "boss" && ++k.age % 6 === 0) { k.v++; log += ` The ${k.name} grows to ${k.v}.`; }
  }
  if (s.stairOpen) {
    s.dark++;
    if (s.dark % 3 === 0) {
      for (const k of s.grid) if (k && (k.t === "monster" || k.t === "coin")) k.v++;
      log += " The dark grows. Monsters and coins grow by 1.";
    }
  }
  return log;
}

// Step onto cell i. A diagonal step needs rope. Returns what happened, or null if the step is not possible.
function act(s, i, rope) {
  if (s.phase !== "play" || i < 0 || !s.grid[i]) return null;
  const hr = row(s.hero), hc = col(s.hero), dr = row(i) - hr, dc = col(i) - hc;
  const orth = Math.abs(dr) + Math.abs(dc) === 1, diag = Math.abs(dr) === 1 && Math.abs(dc) === 1;
  if (!orth && !(diag && rope && s.tools.includes("rope"))) return null;
  if (diag) s.tools.splice(s.tools.indexOf("rope"), 1);
  const c = s.grid[i], coins0 = s.coins;
  const ev = { card: c, dmg: 0, heal: 0, gold: 0, dead: false, spare: false, marks: [] };
  let log = resolve(s, c, ev);
  log += checkDeath(s, ev);
  ev.gold = s.coins - coins0;
  if (!ev.dead) {
    const h = s.hero;
    s.grid[i] = null;
    s.hero = i;
    s.steps++;
    if (c.t === "stair") {
      s.phase = "shop";
      s.shop = openShop(s);
    } else {
      // The line of cards behind you slides after you, and a new card lands at the far end.
      // When a warden falls nothing slides: the stair lands right behind you instead.
      let vr = row(h), vc = col(h), br = vr - dr, bc = vc - dc;
      while (c.t !== "boss" && cell(br, bc) >= 0) {
        s.grid[vr * N + vc] = s.grid[br * N + bc];
        vr = br; vc = bc; br -= dr; bc -= dc;
      }
      log += tick(s);
      s.grid[vr * N + vc] = draw(s);
      s.floorSteps++;
      if (c.t === "altar") {
        s.deal = offerDeals(s);
        if (s.deal.length) s.phase = "deal";
        else log += " It has nothing to offer you.";
      }
      if (s.spoils && s.spoils.length) s.phase = "spoils";
    }
  }
  s.log = log.trim();
  return ev;
}

// A foe killed by a tool leaves a gap, and a new card lands in it.
function slay(s, j, v, ev) {
  const msg = reward(s, s.grid[j], v, ev);
  s.grid[j] = draw(s);
  return msg;
}

// Tools never take a step. Returns what happened, or null if the tool can't be used that way.
function useTool(s, k, i) {
  const slot = s.tools.indexOf(k);
  if (slot < 0 || s.phase !== "play") return null;
  const ev = { tool: k, dmg: 0, heal: 0, gold: 0, dead: false, spare: false, marks: [] };
  const coins0 = s.coins;
  const near = ORTH.map(([dr, dc]) => cell(row(s.hero) + dr, col(s.hero) + dc)).filter((j) => j >= 0);
  let log;
  if (k === "stub") {
    const g = Math.min(4, s.max - s.hp);
    if (!g) return null;
    s.hp += g;
    ev.heal = g;
    log = `You light a candle stub. Candle +${g}.`;
  } else if (k === "torch") {
    s.torch = 10;
    log = "You light a torch. The next 3 cards show for 10 steps.";
  } else if (k === "oil") {
    const hit = near.filter((j) => isFoe(s.grid[j]));
    if (!hit.length) return null;
    log = hit.length === 1 ? "The oil catches one monster." : `The oil catches ${hit.length} monsters.`;
    for (const j of hit) {
      const c = s.grid[j], v0 = c.v;
      c.v -= 3;
      ev.marks.push([j, "−3"]);
      log += c.v > 0 ? ` The ${c.name} burns down to ${c.v}.` : ` The ${c.name} burns away.` + slay(s, j, v0, ev);
    }
  } else if (k === "holy") {
    if (!near.includes(i) || !isFoe(s.grid[i])) return null;
    const c = s.grid[i], v0 = c.v;
    c.v = Math.floor(c.v / 2);
    ev.marks.push([i, "½"]);
    log = c.v > 0 ? `Holy water. The ${c.name} shrinks to ${c.v}.` : `Holy water. The ${c.name} dissolves.` + slay(s, i, v0, ev);
  } else if (k === "smoke") {
    if (!near.includes(i)) return null;
    const c = s.grid[i];
    s.grid[s.hero] = c;
    s.grid[i] = null;
    s.hero = i;
    log = `You slip past the ${cardName(c)} in the smoke.`;
  } else return null;
  s.tools.splice(slot, 1);
  ev.gold = s.coins - coins0;
  if (s.spoils && s.spoils.length) s.phase = "spoils";
  s.log = log;
  return ev;
}

// A fallen warden leaves two relics; you keep one.
function takeSpoils(s, k) {
  if (s.phase !== "spoils") return;
  if (k && s.spoils.includes(k)) {
    addRelic(s, k);
    s.log = `You take the ${RELICS[k].name}. The stair down is beside you.`;
  }
  s.spoils = null;
  s.phase = "play";
}

/* the trader on the landing */
const priceScale = (s) => (1 + 0.35 * (s.floor - 1)) * (has(s, "haggler") ? 0.75 : 1) * (s.debt ? 2 : 1);
function openShop(s) {
  const k = priceScale(s), p = (n) => Math.max(1, Math.round(n * k));
  s.debt = false;
  const items = [
    { id: "relight", kind: "candle", name: "Relight", text: "Candle +5. Costs more each time.", price: p(10), again: true },
    { id: "taller", kind: "candle", name: "Taller Candle", text: "Max candle +2, lit. Costs more each time.", price: p(16), again: true },
    { id: "whet", kind: "blade", name: "Whetting", text: "Blade +3. Costs more each time.", price: p(8), again: true },
  ];
  for (const r of shuffled(relicsLeft(s)).slice(0, 3)) items.push({ id: "relic:" + r, kind: "relic", name: RELICS[r].name, text: RELICS[r].text, price: p(RELICS[r].price) });
  for (const t of shuffled(Object.keys(TOOLS)).slice(0, 3)) items.push({ id: "tool:" + t, kind: "tool", name: TOOLS[t].name, text: TOOLS[t].text, price: p(TOOLS[t].price) });
  return { items, sold: [] };
}
function whyNot(s, it) {
  if (s.shop.sold.includes(it.id)) return "Sold";
  if (it.id === "relight" && s.hp >= s.max) return "Full";
  if (it.kind === "tool" && s.tools.length >= pocketSize(s)) return "Full";
  if (s.coins < it.price) return "poor";
  return "";
}
function buy(s, id) {
  const it = s.shop && s.shop.items.find((x) => x.id === id);
  if (!it || whyNot(s, it)) return false;
  s.coins -= it.price;
  if (it.again) it.price = Math.round(it.price * 1.6);
  else s.shop.sold.push(id);
  if (id === "relight") s.hp = Math.min(s.max, s.hp + 5);
  else if (id === "taller") { s.max += 2; s.hp += 2; }
  else if (id === "whet") s.blade += 3;
  else if (it.kind === "relic") addRelic(s, id.slice(6));
  else if (it.kind === "tool") s.tools.push(id.slice(5));
  return true;
}
function leaveShop(s) {
  if (s.phase !== "shop") return;
  s.floor++;
  s.shop = null;
  s.phase = "play";
  enterFloor(s);
  s.log = `You go down to the ${floorName(s.floor)}.`;
}

/* altars */
const DEALS = {
  bleed: {
    give: () => "3 max candle", get: () => "a random relic",
    ok: (s) => s.max > 6 && relicsLeft(s).length > 0,
    take(s) { s.max -= 3; s.hp = Math.min(s.hp, s.max); const k = pickOne(relicsLeft(s)); addRelic(s, k); return `You bleed into the bowl. ${RELICS[k].name}: ${RELICS[k].text}`; },
  },
  edge: {
    give: () => "4 candle, right now", get: (s) => `blade +${4 + s.floor}`,
    ok: (s) => s.hp > 4,
    take(s) { s.hp -= 4; s.blade += 4 + s.floor; return `The altar drinks 4 candle. Blade ${s.blade}.`; },
  },
  gold: {
    give: () => "this floor's warden grows by 4", get: (s) => `${15 + 5 * s.floor} coins`,
    ok: (s) => !s.stairOpen,
    take(s) { const w = s.grid.find((c) => c && c.t === "boss") || s.warden; w.v += 4; gain(s, 15 + 5 * s.floor); return `Coins spill from the bowl. Somewhere, the ${w.name} grows to ${w.v}.`; },
  },
  hands: {
    give: () => "all of your blade", get: () => "2 random tools",
    ok: (s) => s.blade >= 3 && s.tools.length < pocketSize(s),
    take(s) {
      s.blade = 0;
      const got = [];
      for (let n = 0; n < 2 && s.tools.length < pocketSize(s); n++) { const k = pickOne(Object.keys(TOOLS)); s.tools.push(k); got.push(TOOLS[k].name); }
      return `You lay your blades down. In the bowl: ${got.join(" and ")}.`;
    },
  },
  debt: {
    give: () => "the next trader charges double", get: () => "a random relic",
    ok: (s) => !s.debt && relicsLeft(s).length > 0,
    take(s) { s.debt = true; const k = pickOne(relicsLeft(s)); addRelic(s, k); return `A debt is written down. ${RELICS[k].name}: ${RELICS[k].text}`; },
  },
  wick: {
    give: () => "3 candle, right now", get: () => "max candle +4, unlit",
    ok: (s) => s.hp > 3,
    take(s) { s.hp -= 3; s.max += 4; return "Your flame gutters. The candle grows 4 taller."; },
  },
};
function offerDeals(s) {
  return shuffled(Object.keys(DEALS).filter((k) => DEALS[k].ok(s))).slice(0, has(s, "lucky") ? 3 : 2);
}
function takeDeal(s, k) {
  if (s.phase !== "deal") return;
  s.log = k && s.deal.includes(k) ? DEALS[k].take(s) : "You leave the altar alone.";
  s.deal = null;
  s.phase = "play";
}
/* ---------- end rules ---------- */

/* ---------- view ---------- */
const $ = (id) => document.getElementById(id);
const boardEl = $("board"), overlayEl = $("overlay"), sheetEl = $("sheet"), logEl = $("log");
const KEY = "candle-crawl-v3", OLD_KEY = "candle-crawl-v2", RULES = 3;
const ICON = { wax: "wax", blade: "blade", coin: "coin", trap: "trap", chest: "chest", shrine: "shrine", boss: "crown", altar: "altar", stair: "stair" };
const iconOf = (c) => (c.t === "monster" ? BEAST_ICON[c.name.replace("Dread ", "")] || "skull" : c.t === "boss" ? "warden" : ICON[c.t]);
const GOOD = new Set(["wax", "blade", "coin", "shrine"]);
const valueText = (c) => (c.t === "chest" ? "?" : c.t === "altar" || c.t === "stair" ? "" : GOOD.has(c.t) ? "+" + c.v : String(c.v));
const use = (id, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const AIMED = { smoke: "Tap a card beside you to swap places with it.", holy: "Tap a monster beside you to halve it.", rope: "Tap any card touching you, corners too." };

let s = null;
const meta = { bestFloor: 0, runs: 0, seenIntro: false, seenRules: 0, dim: false, big: false, contrast: null };
let busy = false, sheetKind = "", heroEl = null, swipe = null, ignoreClickUntil = 0;
let armed = null, hint = "", fresh = true;
const nodes = new Map();

function store() { try { localStorage.setItem(KEY, JSON.stringify({ s, meta })); } catch (e) { /* private window: play on unsaved */ } }
function restore() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }

function place(el, i) {
  el.style.setProperty("--r", row(i));
  el.style.setProperty("--c", col(i));
}

// Which cells you can tap right now, and what a tap does there.
function targets() {
  const m = new Map();
  if (s.phase !== "play") return m;
  const hr = row(s.hero), hc = col(s.hero);
  for (const [dr, dc] of ORTH) {
    const i = cell(hr + dr, hc + dc);
    if (i < 0 || !s.grid[i]) continue;
    if (armed === "smoke") m.set(i, "smoke");
    else if (armed === "holy") { if (isFoe(s.grid[i])) m.set(i, "holy"); }
    else m.set(i, "step");
  }
  if (armed === "rope") {
    for (const [dr, dc] of DIAG) {
      const i = cell(hr + dr, hc + dc);
      if (i >= 0 && s.grid[i]) m.set(i, "rope");
    }
  }
  return m;
}

function cardNode(c) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "card t-" + c.t + (c.elite ? " elite" : "");
  el.dataset.id = c.id;
  const rank = c.t === "boss" ? "Warden" : c.elite ? "Dread" : "";
  el.innerHTML = (rank ? `<span class="c-rank" aria-hidden="true">${rank}</span>` : "") +
    `<span class="c-val"></span><span class="c-tag"></span>${use(iconOf(c), "ico c-art")}<span class="c-name"></span>`;
  return el;
}

function paintCard(el, c, i, tg) {
  const mode = tg.get(i), reach = !!mode;
  const name = cardName(c), val = valueText(c), tag = el.querySelector(".c-tag");
  const dist = Math.abs(row(i) - row(s.hero)) + Math.abs(col(i) - col(s.hero));
  el.querySelector(".c-val").textContent = val;
  el.querySelector(".c-name").textContent = c.elite ? name.replace("Dread ", "") : name;
  let label = val ? `${name}, ${val}.` : `${name}.`, cls = "", text = "";
  if (mode === "step" || mode === "rope") {
    const cost = costOf(s, c);
    if (cost > 0) {
      text = "−" + cost;
      cls = cost >= s.hp ? "lethal" : "hurt";
      label += cost >= s.hp ? " This would put your candle out." : ` Costs ${cost} candle.`;
    } else if (isFoe(c)) {
      text = "safe";
      cls = "safe";
      label += " Your blade takes it.";
    }
    label += mode === "rope" ? " Climb to it with the rope." : " Step onto it.";
  } else if (mode === "smoke") {
    text = "swap"; cls = "aimed"; label += " Swap places with it.";
  } else if (mode === "holy") {
    text = "→" + Math.floor(c.v / 2); cls = "aimed"; label += ` Halve it to ${Math.floor(c.v / 2)}.`;
  } else label += " Out of reach.";
  tag.textContent = text;
  tag.className = "c-tag " + cls;
  el.classList.toggle("reach", reach);
  el.classList.toggle("aim", reach && mode !== "step");
  el.classList.toggle("lethal", cls === "lethal");
  el.classList.toggle("l2", !reach && dist <= 2);
  el.classList.toggle("l3", !reach && dist === 3);
  el.classList.toggle("l4", !reach && dist >= 4);
  el.tabIndex = reach ? 0 : -1;
  el.setAttribute("aria-disabled", String(!reach));
  el.setAttribute("aria-label", label);
  place(el, i);
}

function clearBoard() {
  for (const el of nodes.values()) el.remove();
  nodes.clear();
  fresh = true;
}

function render() {
  const tg = targets(), live = new Set();
  s.grid.forEach((c, i) => {
    if (!c) return;
    live.add(c.id);
    let el = nodes.get(c.id);
    if (!el) {
      el = cardNode(c);
      nodes.set(c.id, el);
      boardEl.appendChild(el);
      if (fresh) el.style.animationDelay = i * 25 + "ms";
      el.classList.add("enter");
      el.addEventListener("animationend", () => { el.classList.remove("enter"); el.style.animationDelay = ""; }, { once: true });
    }
    paintCard(el, c, i, tg);
  });
  fresh = false;
  for (const [id, el] of nodes) {
    if (live.has(id)) continue;
    nodes.delete(id);
    el.classList.add("leave");
    el.tabIndex = -1;
    setTimeout(() => el.remove(), 260);
  }

  place(heroEl, s.hero);
  heroEl.style.setProperty("--life", Math.min(1, s.hp / s.max));
  heroEl.classList.toggle("out", s.phase === "dead");
  heroEl.querySelector(".c-val").textContent = s.hp;
  heroEl.querySelector(".c-tag").innerHTML = s.blade ? use("blade") + s.blade : "";
  boardEl.style.setProperty("--gx", ((col(s.hero) * 2 + 1) / (2 * N)) * 100 + "%");
  boardEl.style.setProperty("--gy", ((row(s.hero) * 2 + 1) / (2 * N)) * 100 + "%");

  $("where").textContent = `Floor ${s.floor} · ${floorName(s.floor)}`;
  $("hp").innerHTML = `${s.hp}<small>/${s.max}</small>`;
  $("hp-bar").style.setProperty("--p", Math.min(1, s.hp / s.max));
  $("blade").textContent = s.blade;
  $("coins").textContent = s.coins;

  const warden = s.grid.find((c) => c && c.t === "boss");
  const omen = $("omen");
  let omenText, omenP, omenCls = "";
  if (s.stairOpen) {
    const left = 3 - (s.dark % 3);
    omenText = `The stair is open. The dark grows ${left === 1 ? "next step" : `in ${left} steps`}.`;
    omenP = (s.dark % 3) / 3;
    omenCls = "dark";
  } else if (warden) {
    omenText = `The ${warden.name} is here. It grows by 1 every 6 steps.`;
    omenP = 1;
    omenCls = "here";
  } else {
    const left = FLOOR_STEPS - s.floorSteps;
    omenText = left <= 1 ? `The ${s.warden.name} arrives next step.` : `The ${s.warden.name} arrives in ${left} steps.`;
    omenP = s.floorSteps / FLOOR_STEPS;
  }
  $("omen-text").textContent = omenText;
  $("omen-bar").style.setProperty("--p", omenP);
  omen.className = "omen " + omenCls;

  const nextEl = $("next");
  const peek = s.phase !== "play" ? 0 : s.torch > 0 ? 3 : has(s, "moth") ? 1 : 0;
  nextEl.hidden = !peek;
  if (peek) {
    nextEl.innerHTML = (s.torch > 0 ? `Next (torch, ${s.torch} steps):` : "Next:") +
      upcoming(s, peek).map((n) => `<span class="t-${n.t}">${use(iconOf(n))}${cardName(n)} ${valueText(n)}</span>`).join("");
  }

  let pocket = s.tools.map((k) => `<button class="tool${armed === k ? " armed" : ""}" type="button" data-tool="${k}" aria-pressed="${armed === k}">${use(TOOLS[k].icon)}<span>${TOOLS[k].name}</span></button>`).join("");
  for (let j = s.tools.length; j < pocketSize(s); j++) pocket += `<span class="tool empty">${s.tools.length === 0 && j === 0 ? "Tools go here" : ""}</span>`;
  $("pocket").innerHTML = pocket;

  logEl.textContent = hint || s.log;
  logEl.classList.toggle("hint", !!hint);
  $("relics").innerHTML = s.relics
    .map((k) => `<button class="chip${k === "spare" && s.spareUsed ? " spent" : ""}" type="button" data-relic="${k}">${RELICS[k].name}</button>`)
    .join("");
  $("best").textContent = meta.bestFloor ? `Deepest: floor ${meta.bestFloor}` : "First run";
}

function floater(text, kind, i) {
  const f = document.createElement("span");
  f.className = "floater " + kind;
  f.textContent = text;
  place(f, i);
  boardEl.appendChild(f);
  f.addEventListener("animationend", () => f.remove());
}

function finishRun() {
  meta.runs++;
  const newBest = s.floor > meta.bestFloor;
  meta.bestFloor = Math.max(meta.bestFloor, s.floor);
  return newBest;
}

// Everything after a step or a tool: redraw, show the numbers, save, then open whatever sheet comes next.
function after(ev) {
  busy = true;
  armed = null;
  hint = "";
  const newBest = ev.dead ? finishRun() : false;
  render();
  for (const [j, t] of ev.marks) floater(t, "mark", j);
  if (ev.dmg) {
    floater("−" + ev.dmg, "dmg", s.hero);
    heroEl.classList.remove("hurt");
    void heroEl.offsetWidth;
    heroEl.classList.add("hurt");
  }
  if (ev.heal) floater("+" + ev.heal, "heal", s.hero);
  if (ev.gold) floater("+" + ev.gold, "gold", s.hero);
  store();
  setTimeout(() => {
    busy = false;
    if (s.phase === "dead") showDeath(newBest);
    else if (s.phase === "shop") showShop();
    else if (s.phase === "deal") showDeal();
    else if (s.phase === "spoils") showSpoils();
  }, ev.dead ? 900 : s.phase !== "play" ? 500 : 170);
}

function stepTo(i, viaRope) {
  if (busy || !s || s.phase !== "play" || !overlayEl.hidden) return;
  const ev = act(s, i, viaRope);
  if (ev) after(ev);
}
function stepDir(key) {
  if (busy || !s || s.phase !== "play" || !overlayEl.hidden) return;
  const d = DIRS[key], i = cell(row(s.hero) + d[0], col(s.hero) + d[1]);
  if (armed === "smoke" || armed === "holy") return aimAt(i);
  if (i < 0) {
    heroEl.animate([{ transform: "none" }, { transform: `translate(${d[1] * 6}px, ${d[0] * 6}px)` }, { transform: "none" }], { duration: 170 });
    return;
  }
  stepTo(i, false);
}
function aimAt(i) {
  const ev = useTool(s, armed, i);
  if (ev) after(ev);
  else { hint = armed === "holy" ? "Holy water only works on a monster beside you." : AIMED[armed]; render(); }
}

function pressTool(k) {
  if (busy || s.phase !== "play") return;
  if (armed === k) {
    if (k === "smoke" || k === "holy" || k === "rope") { armed = null; hint = ""; render(); return; }
    const ev = useTool(s, k);
    if (ev) after(ev);
    else { armed = null; hint = k === "oil" ? "No monsters beside you to burn." : "Your candle is already full."; render(); }
    return;
  }
  armed = k;
  hint = AIMED[k] ? `${TOOLS[k].name}: ${AIMED[k]} Tap ${TOOLS[k].name} again to put it away.` : `${TOOLS[k].name}: ${TOOLS[k].text} Tap it again to use it.`;
  render();
}

function newGame() {
  s = newRun();
  armed = null;
  hint = "";
  clearBoard();
  closeSheet();
  render();
  store();
}

/* sheets */
function openSheet(kind, html) {
  sheetKind = kind;
  sheetEl.innerHTML = html;
  overlayEl.hidden = false;
  const first = sheetEl.querySelector("button:not(:disabled)");
  if (first) first.focus({ preventScroll: true });
}
function closeSheet() {
  overlayEl.hidden = true;
  sheetKind = "";
}

function showIntro(first) {
  openSheet("intro", `
    <h2 id="sheet-title">Candle Crawl</h2>
    <p>A quiet dungeon game. No sound and no timer, so you can stop mid-step. The run saves as you go. Your score is how deep you get.</p>
    <ul class="legend">
      <li class="t-hero">${use("flame")}<span><b>You.</b> Your candle is your life. Tap a lit card beside it, or swipe, to step onto it. The cards behind you slide after you, and a new one lands at the far edge.</span></li>
      <li class="t-monster">${use("ghoul")}<span><b>Monsters</b> burn your candle by their number. Your blade takes the hit first and wears down by the same amount. Kills pay coins.</span></li>
      <li class="t-dread">${use("horns")}<span><b>Dread monsters</b> wear a gold frame. They are far stronger, and drop a relic or a tool.</span></li>
      <li class="t-blade">${use("blade")}<span><b>Blades</b> add to your blade, like armor.</span></li>
      <li class="t-wax">${use("wax")}<span><b>Wax</b> relights your candle.</span></li>
      <li class="t-coin">${use("coin")}<span><b>Coins</b> buy things between floors.</span></li>
      <li class="t-trap">${use("trap")}<span><b>Spikes</b> always hurt. <b class="t-chest">Chests</b> hold coins, but some bite.</span></li>
      <li class="t-shrine">${use("shrine")}<span><b>Shrines</b> make your candle one taller.</span></li>
      <li class="t-altar">${use("altar")}<span><b>Altars</b> offer two trades. You can walk away.</span></li>
      <li class="t-boss">${use("warden")}<span><b>Wardens</b> arrive after ${FLOOR_STEPS} steps. Kill one to choose a free relic, and the stair down opens beside you. Every 3 steps you stay after that, monsters and coins grow by 1.</span></li>
      <li class="t-stair">${use("stair")}<span><b>The stair</b> leads to a trader who sells candle, blade work, relics and tools, then to a fresh floor.</span></li>
      <li class="t-tool">${use("smoke")}<span><b>Tools</b> wait in your pocket. Using one never costs a step. Tap once to pick it up, again to use or put it away.</span></li>
    </ul>
    <button class="primary" type="button" data-act="close">${first ? "Light the candle" : "Back to it"}</button>`);
}

function wareHtml(it) {
  const why = whyNot(s, it);
  const label = why && why !== "poor" ? why : use("coin") + it.price;
  return `<div class="ware${why === "Sold" ? " sold" : ""}"><div><span class="w-name">${it.name}</span><span class="w-text">${it.text}</span></div>` +
    `<button class="buy" type="button" data-act="buy:${it.id}"${why ? " disabled" : ""} aria-label="${it.name}, ${it.price} coins${why === "poor" ? ", not enough coins" : why ? ", " + why : ""}">${label}</button></div>`;
}
function showShop() {
  const sec = (kind, title, note) => {
    const its = s.shop.items.filter((x) => x.kind === kind);
    return its.length ? `<section class="shop-sec"><h3>${title}${note || ""}</h3>${its.map(wareHtml).join("")}</section>` : "";
  };
  const scroll = overlayEl.scrollTop;
  openSheet("shop", `
    <h2 id="sheet-title">The landing</h2>
    <p>A trader sits on the stair with a lantern and a blanket of goods. You have <span class="purse">${use("coin")}${s.coins}</span> coins and ${s.hp} of ${s.max} candle.</p>
    ${sec("candle", "Candle")}${sec("blade", "Blade")}${sec("relic", "Relics")}${sec("tool", "Tools", ` · pocket ${s.tools.length} of ${pocketSize(s)}`)}
    <button class="primary" type="button" data-act="descend">Go down to the ${floorName(s.floor + 1)}</button>`);
  overlayEl.scrollTop = scroll;
}

function showDeal() {
  openSheet("deal", `
    <h2 id="sheet-title">An altar</h2>
    <p>Something in the dark wants to trade. Take one deal, or walk away.</p>
    <div class="choices">${s.deal.map((k) => `<button class="choice" type="button" data-act="deal:${k}"><span class="give"><b>Give</b> ${DEALS[k].give(s)}</span><span class="get"><b>Get</b> ${DEALS[k].get(s)}</span></button>`).join("")}</div>
    <button class="ghost" type="button" data-act="deal:">Walk away</button>`);
}

function showSpoils() {
  openSheet("spoils", `
    <h2 id="sheet-title">The ${s.warden.name} falls</h2>
    <p>It was guarding two things. Take one with you. The stair down is right beside you.</p>
    <div class="choices">${s.spoils.map((k) => `<button class="choice relic" type="button" data-act="spoils:${k}"><b>${RELICS[k].name}</b><span>${RELICS[k].text}</span></button>`).join("")}</div>`);
}

function showSettings() {
  const sw = (key, name, text) => `<button class="switch" type="button" role="switch" aria-checked="${!!meta[key]}" data-act="set:${key}"><span><b>${name}</b><span>${text}</span></span><i aria-hidden="true"></i></button>`;
  openSheet("settings", `
    <h2 id="sheet-title">Settings</h2>
    <div class="switches">
      ${sw("big", "Larger text", "Bigger numbers and plain lettering on the cards, and larger text everywhere.")}
      ${sw("contrast", "Stronger contrast", "Brighter text and edges. Cards out of reach stay easy to read.")}
      ${sw("dim", "Dim the screen", "A dark veil over everything, for a dark room.")}
    </div>
    <button class="primary" type="button" data-act="close">Done</button>`);
}

function showDeath(newBest) {
  const tally = [["Floor", s.floor], ["Steps", s.steps], ["Kills", s.kills], ["Coins", s.earned]]
    .map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("");
  openSheet("death", `
    <h2 id="sheet-title">Your candle is out</h2>
    <p>${cap(s.cause || "the dark")} put it out on floor ${s.floor}, the ${floorName(s.floor)}.</p>
    <div class="tally">${tally}</div>
    <p class="muted">${newBest ? "Your deepest run yet." : `Deepest: floor ${meta.bestFloor}.`} Runs: ${meta.runs}.</p>
    <button class="primary" type="button" data-act="again">Light another candle</button>`);
}

function showConfirmNew() {
  openSheet("confirm", `
    <h2 id="sheet-title">Start over?</h2>
    <p>This run ends here, on floor ${s.floor}. It still counts toward your deepest.</p>
    <div class="row"><button class="primary" type="button" data-act="abandon">Start a new run</button><button class="ghost" type="button" data-act="close">Keep playing</button></div>`);
}

sheetEl.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act_ = b.dataset.act, cut = act_.indexOf(":");
  const a = cut < 0 ? act_ : act_.slice(0, cut), arg = cut < 0 ? "" : act_.slice(cut + 1);
  if (a === "close") {
    if (sheetKind === "intro") { meta.seenIntro = true; meta.seenRules = RULES; store(); }
    closeSheet();
    if (s.phase === "shop") showShop();
    else if (s.phase === "deal") showDeal();
    else if (s.phase === "spoils") showSpoils();
  } else if (a === "buy") {
    if (buy(s, arg)) { render(); store(); showShop(); }
  } else if (a === "descend") {
    leaveShop(s);
    clearBoard();
    closeSheet();
    render();
    store();
  } else if (a === "deal") {
    takeDeal(s, arg);
    closeSheet();
    render();
    store();
  } else if (a === "spoils") {
    takeSpoils(s, arg);
    closeSheet();
    render();
    store();
  } else if (a === "set") {
    meta[arg] = !meta[arg];
    b.setAttribute("aria-checked", String(meta[arg]));
    applySettings();
    store();
  } else if (a === "again") newGame();
  else if (a === "abandon") { finishRun(); newGame(); }
});

/* input */
boardEl.addEventListener("click", (e) => {
  if (performance.now() < ignoreClickUntil || busy) return;
  const el = e.target.closest(".card[data-id]");
  if (!el) return;
  const i = s.grid.findIndex((c) => c && String(c.id) === el.dataset.id);
  const mode = targets().get(i);
  if (mode === "step") stepTo(i, false);
  else if (mode === "rope") stepTo(i, true);
  else if (mode === "smoke" || mode === "holy") aimAt(i);
});
boardEl.addEventListener("pointerdown", (e) => { swipe = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
boardEl.addEventListener("pointercancel", () => { swipe = null; });
boardEl.addEventListener("pointerup", (e) => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
  ignoreClickUntil = performance.now() + 350;
  stepDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
});
document.addEventListener("keydown", (e) => {
  if (!overlayEl.hidden) {
    if (e.key === "Escape" && (sheetKind === "intro" || sheetKind === "confirm")) sheetEl.querySelector('[data-act="close"]').click();
    return;
  }
  if (e.key === "Escape" && armed) { armed = null; hint = ""; render(); return; }
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" }[e.key];
  if (k && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); stepDir(k); }
});
$("pocket").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tool]");
  if (t) pressTool(t.dataset.tool);
});
$("relics").addEventListener("click", (e) => {
  const b = e.target.closest("[data-relic]");
  if (!b) return;
  const k = b.dataset.relic;
  hint = `${RELICS[k].name}: ${RELICS[k].text}` + (k === "spare" && s.spareUsed ? " Already used." : "");
  render();
});
$("btn-help").addEventListener("click", () => showIntro(false));
$("btn-new").addEventListener("click", () => (s.steps === 0 && s.floor === 1 ? newGame() : showConfirmNew()));
$("btn-settings").addEventListener("click", showSettings);
function applySettings() {
  const root = document.documentElement;
  root.classList.toggle("big", !!meta.big);
  root.classList.toggle("contrast", !!meta.contrast);
  $("dimmer").hidden = !meta.dim;
}

/* boot */
// Runs saved before blades stacked: fold any sheathed blade in, and drop what no longer exists.
function upgrade(saved) {
  const r = saved.s;
  if (r && r.grid) {
    if (r.sheath > 0) r.blade += r.sheath;
    delete r.sheath;
    if (r.shop) r.shop.items = r.shop.items.filter((x) => x.id !== "sheath");
    if (r.deal) r.deal = r.deal.map((k) => (k === "low" ? "wick" : k)).filter((k) => DEALS[k]);
    if (r.phase === "deal" && !(r.deal && r.deal.length)) r.phase = "play";
    if (!r.spoils) r.spoils = null;
  }
  return saved;
}

function start(data) {
  let saved = data && data.s ? data : restore();
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); } catch (e) { saved = null; } }
  if (saved) upgrade(saved);
  if (saved && saved.meta) Object.assign(meta, saved.meta);
  if (meta.contrast === null || meta.contrast === undefined) meta.contrast = matchMedia("(prefers-contrast: more)").matches;
  s = saved && saved.s && saved.s.grid && saved.s.phase !== "dead" ? saved.s : newRun();
  heroEl = document.createElement("div");
  heroEl.className = "card hero t-hero";
  heroEl.setAttribute("aria-hidden", "true");
  heroEl.innerHTML = `<span class="c-val"></span><span class="c-tag"></span><span class="candle"><span class="flame"></span><span class="stick"></span></span><span class="c-name">You</span>`;
  boardEl.appendChild(heroEl);
  render();
  applySettings();
  if (meta.seenRules !== RULES) showIntro(!meta.seenIntro);
  else if (s.phase === "shop") showShop();
  else if (s.phase === "deal") showDeal();
  else if (s.phase === "spoils") showSpoils();
}
try { window.claude?.hot?.snapshot?.(() => ({ s, meta })); } catch (e) { /* not in a viewer */ }
if (window.claude?.hot?.ready) window.claude.hot.ready((data) => start(data || {}));
else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
