<title>Flak Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-thumb portrait game. A thin HUD on top, the night sky under it, the city on the ground, and a thumb band below. Dark only, like Candle Crawl. */
:root {
  --soot: #0f0c0b;
  --stone: #1b1612;
  --edge: #3a3029;
  --bone: #e3d3b4;
  --ash: #9a8a72;
  --flame: #eda14b;
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--soot); color: var(--bone);
  font: 16px/1.35 var(--font-pixel); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  font-variant-ligatures: none;
}
[hidden] { display: none !important; }
.app {
  box-sizing: border-box; height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 6px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { flex: none; display: flex; align-items: center; gap: 12px; }
.stat { display: grid; gap: 2px; line-height: 1; }
.stat span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ash); }
.stat b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.hud button {
  appearance: none; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--edge); background: var(--stone); color: var(--bone);
  font: 600 13px/1 var(--font-pixel); cursor: pointer;
}
.hud button[aria-pressed="false"] { color: var(--ash); text-decoration: line-through; }
.hud button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.stage { position: relative; flex: 1; min-height: 0; touch-action: none; border-radius: 4px; overflow: hidden; background: #000; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
.hint {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; place-items: center;
  padding: 0 12px; text-align: center; color: var(--ash); font-size: 13px; letter-spacing: .03em; pointer-events: none;
}
.toast {
  position: absolute; left: 0; right: 0; top: 34%; display: grid; gap: 6px; text-align: center; pointer-events: none;
  font: 700 24px/1 var(--font-pixel); color: var(--flame); text-shadow: 0 2px 0 #000;
}
.toast small { font-size: 15px; color: var(--bone); }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
  text-align: center; background: rgba(15, 12, 11, .84); cursor: pointer;
}
.card { display: grid; gap: 12px; max-width: 30ch; }
.card h1 { margin: 0; font: 700 36px/1 var(--font-pixel); color: var(--flame); }
.card p { margin: 0; }
.card .sub { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ash); }
.card .go { margin-top: 6px; font-size: 18px; font-weight: 600; }
</style>

<div class="app">
  <div class="hud">
    <div class="stat"><span>Night</span><b id="h-wave">1</b></div>
    <div class="stat"><span>Score</span><b id="h-score">0</b></div>
    <div class="stat"><span>Cities</span><b id="h-cities">6</b></div>
    <div class="spacer"></div>
    <button id="b-controls" type="button" aria-label="Change controls">Tap</button>
    <button id="b-sound" type="button" aria-pressed="false">Sound</button>
    <button id="b-pause" type="button" aria-label="Pause">II</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="180" height="300"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="overlay" id="ov" role="button" tabindex="0">
      <div class="card"><p class="sub" id="ov-s"></p><h1 id="ov-t"></h1><div class="card" id="ov-b"></div><p class="go" id="ov-go"></p></div>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY = "flak-proto:";
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  };

  // ---------- sound, vibration, screen ----------
  let soundOn = store.get("sound", false), actx = null;
  function ensureAudio() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(f, d, type, vol, f2) {
    if (!soundOn || !actx) return;
    try {
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(vol || 0.04, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* no audio */ }
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* not allowed here */ } }
  let wake = null;
  async function keepAwake() {
    try {
      if (navigator.wakeLock && !wake) {
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }

  // ---------- palette ----------
  const C = {
    bone: "#e3d3b4", ash: "#9a8a72", gold: "#d8b25a", flame: "#eda14b", ember: "#d6654d",
    steel: "#8fb3c4", trail: "#7a2e24", mtrail: "#4f6f80", hot: "#ffd38a",
    city: "#3d4658", cityHi: "#55617a", mound: "#4a3c32", moundHi: "#5a4636", rubble: "#3a3029",
  };
  const BLAST = ["#e3d3b4", "#d8b25a", "#eda14b", "#d6654d", "#b884c0", "#8fb3c4"];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

  // ---------- canvas and layout ----------
  const stage = $("#stage"), cv = $("#cv"), ctx = cv.getContext("2d"), hint = $("#hint"), toast = $("#toast");
  const IW = 180;
  let IH = 300, BAND = 40, GY = 250, SP = 1;
  const bg = document.createElement("canvas");
  const BAT_X = [14, 90, 166], CITY_X = [36, 54, 72, 108, 126, 144];

  function resize() {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    IH = clamp(Math.round(IW * r.height / r.width), 220, 480);
    cv.width = IW; cv.height = IH;
    ctx.imageSmoothingEnabled = false;
    BAND = Math.round(IH * 0.13);
    GY = IH - BAND - 9;
    SP = GY / 250;
    hint.style.height = (BAND / IH * 100) + "%";
    cross.y = clamp(cross.y, 4, GY - 12);
    paintBackground();
  }

  function paintBackground() {
    bg.width = IW; bg.height = IH;
    const b = bg.getContext("2d"), img = b.createImageData(IW, IH), d = img.data;
    const sky = ["#08090f", "#0c0d18", "#12111d", "#1a131d", "#24161d", "#2e1a1e"].map(rgb);
    const dirt = rgb("#231b16"), dirt2 = rgb("#2c221b"), bandA = rgb("#16120f"), bandB = rgb("#231c17");
    let seed = 7;
    const srand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let y = 0; y < IH; y++) for (let x = 0; x < IW; x++) {
      let c;
      const th = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
      if (y < GY) {
        const t = Math.pow(y / GY, 1.6) * (sky.length - 1);
        c = sky[Math.min(sky.length - 1, Math.floor(t) + ((t % 1) > th ? 1 : 0))];
      } else if (y < IH - BAND) c = (th > 0.7) ? dirt2 : dirt;
      else c = ((x + y) % 4 === 0) ? bandB : bandA;
      const i = (y * IW + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    b.putImageData(img, 0, 0);
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(srand() * IW), y = Math.floor(srand() * GY * 0.7);
      b.fillStyle = srand() < 0.15 ? C.bone : "#5d586e";
      b.fillRect(x, y, 1, 1);
    }
    b.fillStyle = C.moundHi;
    b.fillRect(0, GY, IW, 1);
    b.fillStyle = "#3a3029";
    b.fillRect(0, IH - BAND, IW, 1);
  }

  // ---------- state ----------
  const SCHEMES = {
    tap: { label: "Tap", hint: "Tap the sky to fire there" },
    offset: { label: "Offset", hint: "Touch, slide, lift · fires just above your thumb" },
    ball: { label: "Ball", hint: "Drag anywhere like a trackball · lift to fire" },
  };
  const ORDER = ["tap", "offset", "ball"];
  let scheme = store.get("scheme", "tap");
  if (!SCHEMES[scheme]) scheme = "tap";

  let state = "title"; // title | play | paused | clear | falling | over
  let bats = [], cities = [], warheads = [], missiles = [], blasts = [], parts = [];
  let wave = 1, score = 0, best = store.get("best", 0);
  let spawnLeft = 0, spawnT = 0, speed = 14, mirvChance = 0, clearT = 0, fallT = 0, shake = 0, bonus = 0, introT = 0;
  const cross = { x: 90, y: 110 };
  let aim = null, ptr = null;
  const OFFSET = 26, BALL_GAIN = 1.6;

  function newGame() {
    bats = BAT_X.map((x) => ({ x, alive: true, ammo: 10 }));
    cities = CITY_X.map((x) => ({ x, alive: true }));
    score = 0;
    startWave(1);
  }
  function startWave(n) {
    wave = n;
    warheads = []; missiles = []; blasts = [];
    spawnLeft = Math.min(10 + 2 * (n - 1), 30);
    spawnT = 0.8;
    speed = 15 + 3 * n;
    mirvChance = n >= 2 ? Math.min(0.12 + 0.05 * n, 0.4) : 0;
    for (const b of bats) { b.alive = true; b.ammo = 10; }
    introT = 1.2;
    hud();
  }
  const mult = () => Math.min(6, 1 + Math.floor((wave - 1) / 2));

  function pickTarget() {
    const opts = [];
    for (const c of cities) if (c.alive) opts.push(c, c);
    for (const b of bats) if (b.alive) opts.push(b);
    if (!opts.length) return cities[0];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  function spawnWarhead(x, y, canSplit) {
    const tg = pickTarget(), tx = tg.x + rand(-2, 2), ty = GY;
    const d = Math.hypot(tx - x, ty - y) || 1, v = speed * SP;
    warheads.push({
      x0: x, y0: y, x, y, tx, ty, vx: (tx - x) / d * v, vy: (ty - y) / d * v,
      splitY: canSplit && Math.random() < mirvChance ? rand(0.22, 0.5) * GY : -1,
    });
  }

  function fireAt(x, y) {
    if (state !== "play") return;
    x = clamp(x, 2, IW - 2);
    y = clamp(y, 4, GY - 12);
    let pick = null, bd = 1e9;
    for (const b of bats) if (b.alive && b.ammo > 0 && Math.abs(b.x - x) < bd) { bd = Math.abs(b.x - x); pick = b; }
    if (!pick) { beep(110, 0.08, "square", 0.03); return; }
    pick.ammo--;
    const sx = pick.x, sy = GY - 6, d = Math.hypot(x - sx, y - sy) || 1, v = 240 * SP;
    missiles.push({ sx, sy, x: sx, y: sy, tx: x, ty: y, vx: (x - sx) / d * v, vy: (y - sy) / d * v });
    beep(720, 0.08, "square", 0.025, 300);
  }

  function blast(x, y, max, chain) {
    blasts.push({ x, y, r: 0, max, t: 0, chain, seed: Math.floor(Math.random() * 6) });
  }

  function impact(w) {
    for (const c of cities) if (c.alive && Math.abs(c.x - w.tx) < 8) { c.alive = false; burst(c.x, GY - 3, C.flame, 14); }
    for (const b of bats) if (b.alive && Math.abs(b.x - w.tx) < 9) { b.alive = false; b.ammo = 0; burst(b.x, GY - 3, C.ember, 12); }
    burst(w.tx, GY - 1, C.ember, 6);
    shake = 0.25;
    buzz(60);
    beep(90, 0.3, "sawtooth", 0.05, 40);
    hud();
  }

  function burst(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(Math.PI, Math.PI * 2), sp = rand(20, 70);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), c });
    }
  }

  // ---------- update ----------
  function tickFx(dt) {
    for (const p of parts) { p.life -= dt; p.vy += 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt);
  }

  function update(dt) {
    if (introT > 0) introT -= dt;
    spawnT -= dt;
    if (spawnLeft > 0 && spawnT <= 0) {
      const k = Math.min(spawnLeft, Math.random() < 0.35 ? 2 : 1);
      for (let i = 0; i < k; i++) spawnWarhead(rand(6, IW - 6), 0, true);
      spawnLeft -= k;
      spawnT = rand(0.7, 2.0) / (1 + wave * 0.08);
    }

    for (const w of warheads) {
      w.x += w.vx * dt; w.y += w.vy * dt;
      if (w.splitY > 0 && w.y >= w.splitY) {
        w.splitY = -1;
        const n = Math.random() < 0.5 ? 1 : 2;
        for (let i = 0; i < n; i++) spawnWarhead(w.x, w.y, false); // children trail from the split point
      }
      if (w.y >= w.ty) { w.landed = true; impact(w); }
    }

    for (const m of missiles) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if ((m.tx - m.x) * m.vx + (m.ty - m.y) * m.vy <= 0) {
        m.done = true;
        blast(m.tx, m.ty, 15, false);
        beep(170, 0.25, "sawtooth", 0.04, 50);
      }
    }
    missiles = missiles.filter((m) => !m.done);

    const T1 = 0.4, T2 = 0.65, T3 = 1.05;
    for (const b of blasts) {
      b.t += dt;
      b.r = b.t < T1 ? b.max * (b.t / T1) : b.t < T2 ? b.max : b.max * Math.max(0, 1 - (b.t - T2) / (T3 - T2));
      if (b.r < 1) continue;
      for (const w of warheads) {
        if (w.hit || w.landed) continue;
        if ((w.x - b.x) ** 2 + (w.y - b.y) ** 2 <= b.r * b.r) {
          w.hit = true;
          score += 25 * mult();
          blast(w.x, w.y, 9, true);
          beep(400 + Math.random() * 300, 0.12, "square", 0.03, 120);
          buzz(10);
        }
      }
    }
    blasts = blasts.filter((b) => b.t < T3);
    warheads = warheads.filter((w) => !w.hit && !w.landed);
    tickFx(dt);
    hud();

    if (!cities.some((c) => c.alive)) {
      state = "falling"; fallT = 1.4;
      return;
    }
    if (spawnLeft === 0 && !warheads.length && !missiles.length && !blasts.length) {
      const ammo = bats.reduce((s, b) => s + (b.alive ? b.ammo : 0), 0);
      const alive = cities.filter((c) => c.alive).length;
      bonus = (ammo * 5 + alive * 100) * mult();
      score += bonus;
      state = "clear"; clearT = 2.0;
      beep(660, 0.12, "square", 0.04, 990);
      setTimeout(() => beep(990, 0.18, "square", 0.04, 1320), 130);
      hud();
    }
  }

  // ---------- draw ----------
  function line(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) | 0;
    for (let i = 0; i <= n; i++) {
      const t = n ? i / n : 0;
      ctx.fillRect(Math.round(x0 + dx * t), Math.round(y0 + dy * t), 1, 1);
    }
  }
  function disc(cx, cy, r) {
    r = Math.round(r); cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy + r * 0.5)));
      ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
    }
  }
  function drawCity(c) {
    const x = c.x - 6, y = GY;
    if (!c.alive) {
      ctx.fillStyle = C.rubble; ctx.fillRect(x + 1, y - 2, 11, 2);
      ctx.fillStyle = "#6b2f25"; ctx.fillRect(x + 3, y - 3, 2, 1); ctx.fillRect(x + 8, y - 3, 2, 1);
      return;
    }
    const hs = [6, 10, 5, 8];
    hs.forEach((h, i) => {
      ctx.fillStyle = i % 2 ? C.cityHi : C.city;
      ctx.fillRect(x + i * 3, y - h, 3, h);
    });
    ctx.fillStyle = C.gold;
    ctx.fillRect(x + 1, y - 4, 1, 1); ctx.fillRect(x + 4, y - 8, 1, 1);
    ctx.fillRect(x + 4, y - 5, 1, 1); ctx.fillRect(x + 10, y - 6, 1, 1); ctx.fillRect(x + 7, y - 2, 1, 1);
  }
  function drawBattery(b) {
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i === 5 ? C.moundHi : C.mound;
      ctx.fillRect(b.x - 11 + i, GY - i, 22 - 2 * i, 1);
    }
    if (!b.alive) { ctx.fillStyle = "#6b2f25"; ctx.fillRect(b.x - 2, GY - 6, 4, 1); return; }
    ctx.fillStyle = C.bone;
    for (let i = 0; i < b.ammo; i++) ctx.fillRect(b.x - 4 + (i % 5) * 2, GY + 2 + Math.floor(i / 5) * 3, 1, 2);
  }
  function drawCross(x, y, col) {
    x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = col;
    ctx.fillRect(x - 4, y, 3, 1); ctx.fillRect(x + 2, y, 3, 1);
    ctx.fillRect(x, y - 4, 1, 3); ctx.fillRect(x, y + 2, 1, 3);
  }
  function draw(time) {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
    ctx.drawImage(bg, 0, 0);
    for (const c of cities) drawCity(c);
    for (const b of bats) drawBattery(b);

    ctx.fillStyle = C.trail;
    for (const w of warheads) line(w.x0, w.y0, w.x, w.y);
    ctx.fillStyle = Math.floor(time * 10) % 2 ? C.hot : "#ffffff";
    for (const w of warheads) ctx.fillRect(Math.round(w.x), Math.round(w.y), 1, 1);

    ctx.fillStyle = C.mtrail;
    for (const m of missiles) line(m.sx, m.sy, m.x, m.y);
    ctx.fillStyle = C.bone;
    for (const m of missiles) {
      ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
      if (Math.floor(time * 8) % 2) {
        const tx = Math.round(m.tx), ty = Math.round(m.ty);
        ctx.fillRect(tx - 1, ty - 1, 1, 1); ctx.fillRect(tx + 1, ty - 1, 1, 1);
        ctx.fillRect(tx, ty, 1, 1); ctx.fillRect(tx - 1, ty + 1, 1, 1); ctx.fillRect(tx + 1, ty + 1, 1, 1);
      }
    }

    for (const b of blasts) {
      if (b.r < 0.5) continue;
      ctx.fillStyle = BLAST[(Math.floor(time * 16) + b.seed) % BLAST.length];
      disc(b.x, b.y, b.r);
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.c;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
    ctx.globalAlpha = 1;

    if (state === "play") {
      if (scheme === "ball") drawCross(cross.x, cross.y, ptr ? C.bone : C.ash);
      if (scheme === "offset" && aim) drawCross(aim.x, aim.y, C.bone);
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now(), toastKey = "";
  function setToast(title, small) {
    const key = title + "|" + (small || "");
    if (key === toastKey) return;
    toastKey = key;
    toast.replaceChildren();
    if (!title) return;
    toast.append(document.createTextNode(title));
    if (small) { const s = document.createElement("small"); s.textContent = small; toast.append(s); }
  }
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (state === "play") update(dt);
    else if (state === "clear") {
      tickFx(dt); clearT -= dt;
      if (clearT <= 0) { startWave(wave + 1); state = "play"; }
    } else if (state === "falling") {
      tickFx(dt); fallT -= dt;
      if (fallT <= 0) gameOver();
    } else tickFx(dt);
    draw(now / 1000);
    if (state === "clear") setToast(`Night ${wave} survived`, `+${bonus}`);
    else if (state === "play" && introT > 0) setToast(`Night ${wave}`);
    else setToast("");
    requestAnimationFrame(frame);
  }

  function gameOver() {
    state = "over";
    if (score > best) { best = score; store.set("best", best); }
    buzz([60, 40, 120]);
    overlay("The city fell", "Flak", [`You lasted until night ${wave} with ${score} points.`, `Best: ${best}.`], "Tap to play again");
  }

  // ---------- HUD and overlay ----------
  function hud() {
    $("#h-wave").textContent = wave;
    $("#h-score").textContent = score;
    $("#h-cities").textContent = cities.filter((c) => c.alive).length;
  }
  const ov = $("#ov");
  function overlay(title, sub, lines, go) {
    $("#ov-t").textContent = title;
    $("#ov-s").textContent = sub;
    $("#ov-b").replaceChildren(...lines.map((l) => { const p = document.createElement("p"); p.textContent = l; return p; }));
    $("#ov-go").textContent = go;
    ov.hidden = false;
  }
  function titleScreen() {
    overlay("Flak", "Bare prototype · no upgrades", [
      "Warheads fall on your six cities. Your missile bursts where you aim, and the blast takes out anything inside it.",
      "Three bases, ten shots each per night. Lose every city and it's over.",
      `Controls: ${SCHEMES[scheme].label}. ${SCHEMES[scheme].hint}. Switch with the button up top.`,
      best ? `Best: ${best}.` : "",
    ].filter(Boolean), "Tap to start");
  }
  function startFromOverlay() {
    ensureAudio(); keepAwake();
    if (state === "title" || state === "over") newGame();
    ov.hidden = true;
    state = "play";
    last = performance.now();
    hud();
  }
  ov.addEventListener("click", startFromOverlay);
  ov.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startFromOverlay(); } });

  function pause() {
    if (state !== "play") return;
    state = "paused"; ptr = null; aim = null;
    overlay("Paused", "Flak", ["The sky is holding still."], "Tap to continue");
  }
  $("#b-pause").addEventListener("click", pause);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
    else if (state === "play") keepAwake();
  });

  const bControls = $("#b-controls"), bSound = $("#b-sound");
  function setScheme(s) {
    scheme = s; store.set("scheme", s);
    bControls.textContent = SCHEMES[s].label;
    hint.textContent = SCHEMES[s].hint;
    ptr = null; aim = null;
    if (state === "title") titleScreen();
  }
  bControls.addEventListener("click", () => setScheme(ORDER[(ORDER.indexOf(scheme) + 1) % ORDER.length]));
  function paintSound() { bSound.setAttribute("aria-pressed", String(soundOn)); bSound.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off"); }
  bSound.addEventListener("click", () => {
    soundOn = !soundOn; store.set("sound", soundOn);
    ensureAudio(); paintSound();
    beep(660, 0.08, "square", 0.04);
  });

  // ---------- input ----------
  function toGame(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * IW / r.width, y: (e.clientY - r.top) * IH / r.height };
  }
  cv.addEventListener("pointerdown", (e) => {
    if (state !== "play") return;
    e.preventDefault();
    ensureAudio();
    const p = toGame(e);
    if (scheme === "tap") { if (p.y < GY - 4) fireAt(p.x, p.y); return; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    ptr = { id: e.pointerId, ax: p.x, ay: p.y, cx: cross.x, cy: cross.y };
    if (scheme === "offset") aim = { x: clamp(p.x, 2, IW - 2), y: clamp(p.y - OFFSET, 4, GY - 12) };
  });
  cv.addEventListener("pointermove", (e) => {
    if (!ptr || e.pointerId !== ptr.id || state !== "play") return;
    const p = toGame(e);
    if (scheme === "offset") { aim = { x: clamp(p.x, 2, IW - 2), y: clamp(p.y - OFFSET, 4, GY - 12) }; return; }
    if (scheme === "ball") {
      // Relative, like a trackball. Re-anchor at the edges so reversing responds at once.
      const rx = ptr.cx + (p.x - ptr.ax) * BALL_GAIN, ry = ptr.cy + (p.y - ptr.ay) * BALL_GAIN;
      const x = clamp(rx, 2, IW - 2), y = clamp(ry, 4, GY - 12);
      if (x !== rx) { ptr.cx = x; ptr.ax = p.x; }
      if (y !== ry) { ptr.cy = y; ptr.ay = p.y; }
      cross.x = x; cross.y = y;
    }
  });
  cv.addEventListener("pointerup", (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    ptr = null;
    if (state !== "play") { aim = null; return; }
    if (scheme === "offset" && aim) { fireAt(aim.x, aim.y); aim = null; }
    else if (scheme === "ball") fireAt(cross.x, cross.y);
  });
  cv.addEventListener("pointercancel", (e) => { if (ptr && e.pointerId === ptr.id) { ptr = null; aim = null; } });
  cv.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- boot ----------
  newGame();
  setScheme(scheme);
  paintSound();
  resize();
  new ResizeObserver(resize).observe(stage);
  titleScreen();
  hud();
  requestAnimationFrame((n) => { last = n; frame(n); });
})();
</script>
